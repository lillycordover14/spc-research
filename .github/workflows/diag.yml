name: diag-gnews
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install googlenewsdecoder requests 2>&1 | tail -1
      - run: |
          python3 - <<'PY'
          import traceback, requests
          u = "https://news.google.com/rss/articles/CBMifEFVX3lxTE5ocjlGZDNzZkcya0JucERSR1VNWVcycU95cU95dzdkeVM4Q1dUR2JwYlZERmlIckVSWTJXaVdCbHpLbF9hM1F1cU1WZEh1a3B3Y0FmQ1QtNWJyTVFRUUNsVVMweTRISmU3cUVIS0traDhRN2FkdFN4bl9VRTE?oc=5"
          try:
              from googlenewsdecoder import gnewsdecoder
              r = gnewsdecoder(u, interval=1)
              print("::warning::decoder result: " + str(r)[:400])
          except Exception as e:
              print("::warning::decoder exception: " + repr(e)[:400])
          try:
              r = requests.get(u, headers={"User-Agent": "Mozilla/5.0"}, timeout=20, allow_redirects=True)
              print(f"::warning::plain GET status={r.status_code} final={r.url[:150]} len={len(r.text)}")
          except Exception as e:
              print("::warning::GET exception: " + repr(e)[:300])
          PY

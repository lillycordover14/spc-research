# Saved queries. Agent runs these and files hits via scripts/ingest.py. Keep queries specific; broad ones drown the inbox.

alphasense:   # research.alpha-sense.com — expert calls, broker research, earnings transcripts. Export PDF -> inbox/alphasense/
  company_names:
    - "Hadrian" AND (factory OR machining)
    - "Machina Labs"
    - "Senra Systems"
    - "Divergent" AND (Czinger OR DAPS)
    - "Freeform" AND additive
    - "SendCutSend"
    - "Isembard"
    - "Mariana Minerals"
    - "Nox Metals"
    - "Periodic Labs" OR "CuspAI" OR "Radical AI"
    - "Mind Robotics" OR "Arda" AND McGrew
  themes:
    - "autonomous factory" OR "software-defined factory" OR "lights-out manufacturing"
    - "robotic machining" OR "automated job shop" OR "automated machine shop"
    - "metals service center" AND (margin OR automation OR quoting)
    - "precision castings" AND (capacity OR lead time OR shortage)
    - "wire harness" AND (automation OR lead time)
    - "rare earth" AND refining AND (United States OR domestic)
    - "reshoring" AND (defense OR aerospace) AND (machining OR fabrication)
    - "manufacturing labor shortage" AND (robot OR automation)
    - "instant quote" AND (manufacturing OR sheet metal)
    - "factory video" OR "video-trained" AND manufacturing
  earnings_calls_to_pull_quarterly: [Xometry, Proto Labs, Nucor, Ryerson, Reliance, Howmet, ATI, Carpenter Technology, Rockwell Automation]
  expert_call_targets:  # who to request calls with (AlphaSense Expert / Tegus)
    - former Hadrian plant / ops leaders
    - former Machina Labs or Divergent production engineers
    - procurement at Lockheed / RTX / Anduril / SpaceX buying machined parts or harnesses
    - owners of 50-200 person job shops in SoCal / Ohio / Michigan
    - metals service center GM (Ryerson / Reliance / regional)
    - DoD Industrial Base Policy or DIU manufacturing leads
    - rare-earth / lithium refining process engineers (ex-MP Materials, ex-Albemarle)

google_news:   # daily; agent uses WebSearch; file only if new fact about a tracked company or a new candidate
  - '"autonomous factory" startup raises'
  - '"software-defined" manufacturing startup'
  - '"robotic" (machining OR welding OR fabrication) startup funding'
  - '(steel OR aluminum OR titanium) "startup" factory "AI" 2026'
  - '"metals" startup "cut-to-size" OR "service center" software'
  - '"rare earth" OR "critical minerals" refining startup United States funding'
  - '"job shop" acquisition AI startup'
  - 'Hadrian OR "Machina Labs" OR Senra OR Divergent OR Freeform OR SendCutSend OR Isembard OR "Mariana Minerals" OR "Nox Metals"'
  - '"Reindustrialize" 2026'
  - 'Section 232 steel aluminum tariff manufacturers 2026'

harmonic_scout:   # natural-language saved searches; run weekly, add hits to companies/_candidates.md with evidence
  - "US startups founded 2022-2026 that own and operate manufacturing facilities using in-house software and robotics, metals or precision parts, seed to series B"
  - "startups founded by former SpaceX, Tesla, Anduril or Hadrian manufacturing/production engineers, founded after 2023"
  - "startups doing domestic refining or processing of critical minerals, rare earths, lithium, copper with software or automation"
  - "AI for manufacturing startups training models on factory floor video"
  - "robotic welding or metal fabrication startups with their own production facility"

x_search:   # daily via X lists; agent logs only posts with a new fact (funding, hire, contract, plant)
  - from:list ANIP (factory OR plant OR raised OR contract OR hiring)

job_titles_to_flag:   # on careers pages — evidence of what the software does
  - "controls engineer"
  - "CAM automation"
  - "manufacturing software engineer"
  - "computer vision" inspection
  - "robotics perception"
  - "process engineer" welding OR forming
  - "estimating" OR "quoting" engineer
  - "scheduling" OR "production planning" software

sweep_keywords:   # trade-press RSS items are kept only if they mention a tracked company OR one of these (lowercase substring match)
  - autonomous factory
  - software-defined
  - lights-out
  - robotic welding
  - robotic machining
  - automated job shop
  - reshoring
  - service center
  - rare earth
  - critical minerals
  - precision casting
  - forging capacity
  - wire harness
  - additive manufacturing
  - defense industrial base
  - machinist shortage
  - labor shortage

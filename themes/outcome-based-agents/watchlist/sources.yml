# What we watch for this theme and how often. status: seed (unverified) | active | dropped.
# The daily sweep reads rss_and_trade_press; everything else is worked by the agent (see GROKBOT-OBA-PROMPT.md).

cadence: {daily: [google_news_queries, x_lists, rss], weekly: [podcasts, youtube_channels, transcript_libraries, earnings, harmonic_saved_searches], monthly: [reports, conferences]}


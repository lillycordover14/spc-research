  - {name: Diginomica, url: https://diginomica.com, why: enterprise customer case studies, status: seed}
  - {name: The Register AI, url: https://www.theregister.com/software/ai_ml/, why: skeptical enterprise coverage, status: seed}
  - {name: Constellation Research, url: https://www.constellationr.com, why: analyst takes on agent platforms, status: seed}


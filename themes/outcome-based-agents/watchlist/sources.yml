  - {name: VentureBeat AI, url: https://venturebeat.com/category/ai/, why: enterprise agent deployments and vendor news, status: seed}
  - {name: SiliconANGLE AI, url: https://siliconangle.com/category/ai/, why: enterprise software and agent platform coverage, status: seed}
